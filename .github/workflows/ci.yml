name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run db:up
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-results/
            .artifacts/
      - name: Stop database
        if: always()
        run: npm run db:down
